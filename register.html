<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Registration | Royal Feast Events Portal</title>
  <meta name="description" content="Register an account for Royal Feast Events to manage catering requirements, test AI event planning, and track event logistics live.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Remix Icon CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="image/favicon.svg">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <div class="bg-aurora-wrapper">
    <div class="aurora-orb aurora-orb-1"></div>
    <div class="aurora-orb aurora-orb-2"></div>
  </div>
  <div class="bg-noise"></div>

  <!-- Standalone Controls (Top Bar) -->
  <div style="position:fixed; top:20px; right:20px; z-index:100; display:flex; gap:10px;">
    <button class="nav-icon-btn theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
      <i class="ri-moon-line"></i>
    </button>
    <button class="nav-icon-btn rtl-toggle-btn" aria-label="Toggle RTL" title="Toggle RTL/LTR Direction">
      <i class="ri-arrow-left-right-line"></i>
    </button>
  </div>

  <!-- Register Section -->
  <section class="hero-section text-center" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="container">
      <div class="glass-card" style="max-width:480px; margin:0 auto; padding:36px 32px; text-align:center;">
        <a href="index.html" class="logo-wrapper" style="display:inline-flex; margin-bottom:20px; text-decoration:none;">
          <div class="logo-icon"><i class="ri-goblet-fill"></i></div>
          <div class="logo-text"><span>FEAST</span></div>
        </a>

        <h2 class="font-serif gold-gradient-text" style="font-size:1.8rem; margin-bottom:8px;">Create Client Account</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:24px;">Unlock full access to AI menu building & instant quote generation.</p>

        <form action="dashboard.html" method="GET">
          <div class="form-group" style="text-align:left;">
            <label>Full Name</label>
            <input type="text" class="form-control" placeholder="e.g. Eleanor Vance" required>
          </div>

          <div class="form-group" style="text-align:left;">
            <label>Company / Event Host Organization</label>
            <input type="text" class="form-control" placeholder="e.g. Vance Global Enterprises">
          </div>

          <div class="form-group" style="text-align:left;">
            <label>Email Address</label>
            <input type="email" class="form-control" placeholder="eleanor@vanceglobal.com" required>
          </div>

          <div class="form-group" style="text-align:left;">
            <label>Create Password</label>
            <div class="password-input-wrapper">
              <input type="password" class="form-control" placeholder="••••••••••••" required>
              <i class="ri-eye-line password-toggle-icon" title="Toggle Password Visibility"></i>
            </div>
          </div>

          <button type="submit" class="btn-primary auth-btn-compact">
            Create Account & Launch Dashboard <i class="ri-rocket-line"></i>
          </button>
        </form>

        <div style="margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
          Already registered? <a href="login.html" class="auth-link" style="color:var(--gold-primary); font-weight:600;">Login Here</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
</body>
</html>
